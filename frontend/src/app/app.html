<mat-toolbar color="primary">
  <a class="toolbar-title" mat-button routerLink="/">SpellingBee</a>
  <span class="toolbar-spacer"></span>
  <a mat-button routerLink="/words">Words</a>
  <a mat-button routerLink="/sessions">Sessions</a>
  <!-- Voice calibration hidden for now -->
  <!-- <a mat-button routerLink="/calibrate">Calibrate Voice</a> -->
</mat-toolbar>

@if (totalWords() > 0) {
  <section class="mastery-summary">
    <p class="mastery-count">{{ masteredCount() }} / {{ totalWords() }} words mastered</p>
    <div class="mastery-grid">
      @for (m of wordMastery(); track m.word.id) {
        <div
          class="mastery-square"
          [style.background-color]="masteryColor(m.score)"
          [title]="masteryTooltip(m)"
        ></div>
      }
    </div>
  </section>
}

<router-outlet />
